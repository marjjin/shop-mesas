services:
  - type: web
    name: gestion-mesas-api
    runtime: docker
    rootDir: BackEnd
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: ConnectionStrings__Restaurant
        fromDatabase:
          name: gestion-mesas-db
          property: connectionString

databases:
  - name: gestion-mesas-db
    plan: free

services:
  - type: web
    name: gestion-mesas-api
    runtime: docker
    rootDir: BackEnd
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: Authentication__AdminPassword
        sync: false
      - key: Cloudinary__CloudName
        sync: false
      - key: Cloudinary__ApiKey
        sync: false
      - key: Cloudinary__ApiSecret
        sync: false
      - key: Cors__AllowedOrigins__0
        value: https://gestion-mesas-shop.vercel.app
      - key: ConnectionStrings__Restaurant
        fromDatabase:
          name: gestion-mesas-db
          property: connectionString

databases:
  - name: gestion-mesas-db
    plan: free
